spring:
  application:
    name: moa-core

  # 기본 DB는 공통 스키마 moa. 모듈 테이블은 엔티티와 SQL이 스키마를 직접 적는다 (04 설계 0.4)
  # Modulith 발행 기록은 MySQL에서 스키마 지정을 지원하지 않아 기본 DB(moa)에 있어야 한다
  datasource:
    url: jdbc:mysql://localhost:3306/moa?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: moa

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 엔티티와 테이블이 다르면 앱이 뜨지 않음. 테이블은 Flyway만 만든다
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul

  # 인스턴스 하나가 스키마 7개를 만들고 관리. 이력표는 moa에
  flyway:
    default-schema: moa
    schemas: moa,store,category,sales,expense,budget,report

  # 정수 칸(금액, id)에 소수(1000.5)가 오면 잘라 저장하지 않고 400으로 거부한다. 모든 모듈에 적용 (04 설계 D4-15)
  jackson:
    deserialization:
      accept-float-as-int: false

  modulith:
    events:
      republish-outstanding-events-on-restart: true   # 미완료 발행은 다시 뜰 때 재실행 (04 설계 0.3)
